quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=inventory
quarkus.datasource.password=inventory
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inventory

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

kafka.bootstrap.servers=localhost:29092

mp.messaging.incoming.order-created.connector=smallrye-kafka
mp.messaging.incoming.order-created.topic=order-created
mp.messaging.incoming.order-created.group.id=inventory-service
mp.messaging.incoming.order-created.auto.offset.reset=earliest
mp.messaging.incoming.order-created.enable.auto.commit=false
mp.messaging.incoming.order-created.failure-strategy=fail
mp.messaging.incoming.order-created.value.deserializer=com.example.inventory.messaging.OrderCreatedDeserializer

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.flyway.migrate-at-start=true
%test.mp.messaging.incoming.order-created.enabled=false
